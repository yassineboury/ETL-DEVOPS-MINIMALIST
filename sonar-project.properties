# Configuration SonarQube Cloud pour ETL DevOps Minimalist
sonar.projectKey=yassineboury_ETL-DEVOPS-MINIMALIST
sonar.organization=yassineboury

# Informations du projet
sonar.projectName=ETL DevOps Minimalist
sonar.projectVersion=1.0

# Sources à analyser
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/.venv/**,**/venv/**,**/__pycache__/**,**/.pytest_cache/**,**/node_modules/**,**/exports/**,**/.git/**,**/.vscode/**

# Configuration Python
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Langage principal
sonar.language=py
